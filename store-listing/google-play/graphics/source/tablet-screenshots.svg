<svg xmlns="http://www.w3.org/2000/svg" width="7680" height="1080" viewBox="0 0 7680 1080">
  <defs>
    <style>
      .brand { font-family: "Ubuntu Sans", sans-serif; font-size: 18px; font-weight: 700; fill: #22c55e; }
      .headline { font-family: "Ubuntu Sans", sans-serif; font-size: 43px; font-weight: 700; fill: #f8faf9; }
      .subhead { font-family: "Ubuntu Sans", sans-serif; font-size: 20px; fill: #aab3ad; }
      .status { font-family: "Ubuntu Sans", sans-serif; font-size: 13px; font-weight: 600; fill: #303532; }
      .app-title { font-family: "Ubuntu Sans", sans-serif; font-size: 25px; font-weight: 600; fill: #202421; }
      .body { font-family: "Ubuntu Sans", sans-serif; font-size: 20px; fill: #252a27; }
      .small { font-family: "Ubuntu Sans", sans-serif; font-size: 15px; fill: #646c67; }
      .label { font-family: "Ubuntu Sans", sans-serif; font-size: 13px; font-weight: 500; fill: #686f6b; }
      .button { font-family: "Ubuntu Sans", sans-serif; font-size: 16px; font-weight: 600; }
      .rail { font-family: "Ubuntu Sans", sans-serif; font-size: 14px; font-weight: 600; }
    </style>

    <g id="frame">
      <rect width="1920" height="1080" fill="#121513"/>
      <text x="70" y="50" class="brand">OWNDO</text>
      <rect x="50" y="190" width="1820" height="840" rx="22" fill="#fafcfb"/>
    </g>

    <g id="tablet-status">
      <text x="82" y="221" class="status">9:41</text>
      <g transform="translate(1764 207)" fill="none" stroke="#303532" stroke-width="3" stroke-linecap="round">
        <path d="M0 11 L6 5 L12 11"/>
        <path d="M22 13 L22 8 M29 13 L29 5 M36 13 L36 2"/>
        <rect x="48" y="1" width="31" height="14" rx="4"/>
        <rect x="52" y="5" width="21" height="6" rx="2" fill="#303532" stroke="none"/>
      </g>
    </g>

    <g id="checkbox">
      <rect width="28" height="28" rx="5" fill="none" stroke="#777f7a" stroke-width="2"/>
    </g>
    <g id="checked">
      <rect width="28" height="28" rx="5" fill="#4f46e5"/>
      <path d="M6 14 L11 19 L22 7" fill="none" stroke="#fff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="calendar">
      <rect x="1" y="4" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="5" y1="1" x2="5" y2="7" stroke="currentColor" stroke-width="2"/>
      <line x1="14" y1="1" x2="14" y2="7" stroke="currentColor" stroke-width="2"/>
      <line x1="2" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="2"/>
    </g>
    <g id="folder">
      <path d="M2 6 L2 23 L28 23 L28 8 L15 8 L11 4 L2 4 Z" fill="none"
            stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <g id="rail-inbox">
      <rect x="50" y="300" width="176" height="730" fill="#f2f4f2"/>
      <rect x="94" y="352" width="88" height="42" rx="21" fill="#dcd9ff"/>
      <path d="M116 380 L116 367 L159 367 L159 380 L152 387 L123 387 Z"
            fill="none" stroke="#3730a3" stroke-width="2.5"/>
      <text x="119" y="418" class="rail" fill="#3730a3">Inbox</text>
      <g color="#626965"><use href="#folder" x="122" y="472"/></g>
      <text x="107" y="524" class="rail" fill="#626965">Projects</text>
      <line x1="226" y1="300" x2="226" y2="1030" stroke="#d9ddda"/>
    </g>
    <g id="rail-projects">
      <rect x="50" y="300" width="176" height="730" fill="#f2f4f2"/>
      <path d="M116 380 L116 367 L159 367 L159 380 L152 387 L123 387 Z"
            fill="none" stroke="#626965" stroke-width="2.5"/>
      <text x="119" y="418" class="rail" fill="#626965">Inbox</text>
      <rect x="94" y="458" width="88" height="42" rx="21" fill="#dcd9ff"/>
      <g color="#3730a3"><use href="#folder" x="122" y="465"/></g>
      <text x="107" y="524" class="rail" fill="#3730a3">Projects</text>
      <line x1="226" y1="300" x2="226" y2="1030" stroke="#d9ddda"/>
    </g>
    <g id="fab">
      <circle cx="1794" cy="950" r="43" fill="#dcd9ff"/>
      <line x1="1778" y1="950" x2="1810" y2="950" stroke="#3730a3" stroke-width="4" stroke-linecap="round"/>
      <line x1="1794" y1="934" x2="1794" y2="966" stroke="#3730a3" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 01: Wide Inbox -->
  <g transform="translate(0 0)">
    <use href="#frame"/>
    <text x="70" y="105" class="headline">Your tasks. Your data.</text>
    <text x="70" y="145" class="subhead">A clear, private workspace on every screen.</text>
    <use href="#tablet-status"/>
    <text x="82" y="275" class="app-title">Inbox</text>
    <g transform="translate(1650 250)" fill="none" stroke="#454b47" stroke-width="2.5">
      <path d="M0 11 C10 0 25 0 35 11 C25 22 10 22 0 11 Z"/>
      <circle cx="18" cy="11" r="5"/>
    </g>
    <g transform="translate(1711 249)" fill="none" stroke="#454b47" stroke-width="2.5" stroke-linecap="round">
      <path d="M2 12 A12 12 0 0 1 25 6 M25 3 L25 8 L20 8"/>
      <path d="M25 14 A12 12 0 0 1 2 20 M2 23 L2 18 L7 18"/>
    </g>
    <path d="M1795 247 L1795 274 M1783 255 L1795 244 L1807 255 M1781 280 L1809 280"
          fill="none" stroke="#454b47" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="299" x2="1870" y2="299" stroke="#e1e5e2"/>
    <use href="#rail-inbox"/>

    <use href="#checkbox" x="276" y="340"/>
    <text x="328" y="362" class="body">Review launch checklist</text>
    <g transform="translate(328 376)" color="#e57b17"><use href="#calendar"/></g>
    <text x="352" y="391" class="small" fill="#e57b17">Today</text>
    <line x1="328" y1="427" x2="1830" y2="427" stroke="#e3e6e4"/>

    <use href="#checkbox" x="276" y="464"/>
    <text x="328" y="486" class="body">Book train tickets</text>
    <g transform="translate(328 500)" color="#4f46e5"><use href="#calendar"/></g>
    <text x="352" y="515" class="small" fill="#4f46e5">Tomorrow</text>
    <line x1="328" y1="551" x2="1830" y2="551" stroke="#e3e6e4"/>

    <use href="#checkbox" x="276" y="588"/>
    <text x="328" y="610" class="body">Pack for Berlin</text>
    <g transform="translate(328 624)" color="#4f46e5"><use href="#calendar"/></g>
    <text x="352" y="639" class="small" fill="#4f46e5">Tomorrow</text>
    <path d="M1790 600 L1800 610 L1810 600" fill="none" stroke="#6d746f" stroke-width="2.5"/>

    <use href="#checked" x="354" y="680"/>
    <text x="404" y="701" class="small" text-decoration="line-through" fill="#8a918d">Passport and wallet</text>
    <use href="#checkbox" x="354" y="735"/>
    <text x="404" y="756" class="small">Laptop and charger</text>
    <use href="#checkbox" x="354" y="790"/>
    <text x="404" y="811" class="small">Water the plants</text>
    <line x1="328" y1="851" x2="1830" y2="851" stroke="#e3e6e4"/>

    <use href="#checkbox" x="276" y="886"/>
    <text x="328" y="908" class="body">Plan weekend groceries</text>
    <g transform="translate(328 922)" color="#737a76"><use href="#calendar"/></g>
    <text x="352" y="937" class="small">Saturday</text>
    <use href="#fab"/>
  </g>

  <!-- 02: Detailed task -->
  <g transform="translate(1920 0)">
    <use href="#frame"/>
    <text x="70" y="105" class="headline">Plan every detail</text>
    <text x="70" y="145" class="subhead">Notes, projects, deadlines, reminders, and steps.</text>
    <use href="#tablet-status"/>
    <path d="M92 258 L77 273 L92 288" fill="none" stroke="#343936" stroke-width="3"/>
    <text x="120" y="281" class="app-title">Edit Task</text>
    <path d="M1700 253 L1725 253 M1707 253 L1710 279 L1718 279 L1720 253"
          fill="none" stroke="#454b47" stroke-width="2.5"/>
    <text x="1782" y="278" class="button" fill="#4f46e5">Save</text>
    <line x1="50" y1="299" x2="1870" y2="299" stroke="#e1e5e2"/>

    <rect x="90" y="340" width="1740" height="80" rx="7" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <rect x="106" y="330" width="65" height="20" fill="#fafcfb"/>
    <text x="110" y="345" class="label" fill="#4f46e5">Task title</text>
    <text x="110" y="389" class="body">Review launch checklist</text>

    <rect x="90" y="458" width="1740" height="126" rx="7" fill="none" stroke="#8d948f" stroke-width="2"/>
    <rect x="106" y="448" width="142" height="20" fill="#fafcfb"/>
    <text x="110" y="463" class="label">Description (optional)</text>
    <text x="110" y="505" class="small">Confirm store assets, release notes, and the final privacy-policy link.</text>

    <rect x="90" y="622" width="1740" height="78" rx="7" fill="none" stroke="#8d948f" stroke-width="2"/>
    <rect x="106" y="612" width="122" height="20" fill="#fafcfb"/>
    <text x="110" y="627" class="label">Project (optional)</text>
    <text x="110" y="671" class="body">Launch website</text>
    <path d="M1780 652 L1790 662 L1800 652" fill="none" stroke="#555c58" stroke-width="2.5"/>

    <g transform="translate(102 750)" color="#4f46e5"><use href="#calendar"/></g>
    <text x="137" y="767" class="small">2026-07-31</text>
    <text x="1728" y="767" class="button" fill="#4f46e5">Change</text>
    <line x1="90" y1="801" x2="1830" y2="801" stroke="#e1e5e2"/>

    <path d="M105 862 C111 857 108 845 119 843 C130 845 127 857 133 862 Z"
          fill="none" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="137" y="862" class="small">2026-07-31  09:00</text>
    <text x="1728" y="862" class="button" fill="#4f46e5">Change</text>
    <line x1="90" y1="896" x2="1830" y2="896" stroke="#e1e5e2"/>

    <text x="90" y="940" class="small" font-weight="600">Steps per subtask</text>
    <rect x="310" y="913" width="720" height="48" rx="10" fill="#f1f1f8"/>
    <circle cx="420" cy="937" r="18" fill="#4f46e5"/>
    <text x="416" y="943" class="small" fill="#fff" font-weight="700">1</text>
    <text x="600" y="943" class="small">3</text>
    <text x="790" y="943" class="small">5</text>
    <text x="960" y="943" class="small">10</text>
  </g>

  <!-- 03: Wide Projects -->
  <g transform="translate(3840 0)">
    <use href="#frame"/>
    <text x="70" y="105" class="headline">Organize work into projects</text>
    <text x="70" y="145" class="subhead">Keep every area clear and easy to scan.</text>
    <use href="#tablet-status"/>
    <text x="82" y="275" class="app-title">Projects</text>
    <g transform="translate(1730 250)" fill="none" stroke="#454b47" stroke-width="2.5" stroke-linecap="round">
      <path d="M2 12 A12 12 0 0 1 25 6 M25 3 L25 8 L20 8"/>
      <path d="M25 14 A12 12 0 0 1 2 20 M2 23 L2 18 L7 18"/>
    </g>
    <line x1="50" y1="299" x2="1870" y2="299" stroke="#e1e5e2"/>
    <use href="#rail-projects"/>

    <g color="#454b47"><use href="#folder" x="280" y="350"/></g>
    <text x="335" y="371" class="body">Launch website</text>
    <path d="M1800 352 L1810 362 L1800 372" fill="none" stroke="#767d78" stroke-width="2.5"/>
    <line x1="335" y1="413" x2="1830" y2="413" stroke="#e3e6e4"/>

    <g color="#454b47"><use href="#folder" x="280" y="464"/></g>
    <text x="335" y="485" class="body">Home</text>
    <path d="M1800 466 L1810 476 L1800 486" fill="none" stroke="#767d78" stroke-width="2.5"/>
    <line x1="335" y1="527" x2="1830" y2="527" stroke="#e3e6e4"/>

    <g color="#454b47"><use href="#folder" x="280" y="578"/></g>
    <text x="335" y="599" class="body">Learning</text>
    <path d="M1800 580 L1810 590 L1800 600" fill="none" stroke="#767d78" stroke-width="2.5"/>
    <line x1="335" y1="641" x2="1830" y2="641" stroke="#e3e6e4"/>

    <g color="#454b47"><use href="#folder" x="280" y="692"/></g>
    <text x="335" y="713" class="body">Travel</text>
    <path d="M1800 694 L1810 704 L1800 714" fill="none" stroke="#767d78" stroke-width="2.5"/>
    <line x1="335" y1="755" x2="1830" y2="755" stroke="#e3e6e4"/>

    <g color="#454b47"><use href="#folder" x="280" y="806"/></g>
    <text x="335" y="827" class="body">Personal admin</text>
    <path d="M1800 808 L1810 818 L1800 828" fill="none" stroke="#767d78" stroke-width="2.5"/>
    <use href="#fab"/>
  </g>

  <!-- 04: Offline or sync -->
  <g transform="translate(5760 0)">
    <use href="#frame"/>
    <text x="70" y="105" class="headline">Offline first. Sync when you want.</text>
    <text x="70" y="145" class="subhead">No account required for core use.</text>
    <use href="#tablet-status"/>

    <g transform="translate(870 330)">
      <circle cx="90" cy="90" r="76" fill="#e5e2ff"/>
      <circle cx="90" cy="90" r="57" fill="none" stroke="#4f46e5" stroke-width="6"/>
      <path d="M58 92 L79 113 L125 68" fill="none" stroke="#4f46e5" stroke-width="10"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="960" y="545" class="app-title" text-anchor="middle">OwnDo</text>
    <text x="960" y="589" class="small" text-anchor="middle">Your offline-first todo app.</text>
    <text x="960" y="616" class="small" text-anchor="middle">Sync privately with Dropbox.</text>

    <rect x="570" y="680" width="780" height="62" rx="31" fill="#4f46e5"/>
    <path d="M740 712 C743 701 754 697 763 703 C770 694 787 697 791 709 C803 708 807 727 790 728 L750 728 C735 728 731 715 740 712 Z"
          fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="980" y="719" class="button" fill="#fff" text-anchor="middle">Connect Dropbox</text>

    <rect x="570" y="773" width="780" height="62" rx="31" fill="none" stroke="#6e756f" stroke-width="2"/>
    <rect x="744" y="791" width="23" height="22" rx="4" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
    <path d="M750 791 C750 782 761 782 761 791" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="985" y="812" class="button" fill="#3e4541" text-anchor="middle">Continue offline</text>
  </g>
</svg>
